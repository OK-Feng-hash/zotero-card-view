name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Build deterministic XPI
        run: npm run build

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release checksum
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          ASSET="build/zotero-card-view-${VERSION}.xpi"
          EXPECTED=$(node -p "require('./updates.json').addons['zotero-card-view@ok-feng-hash.github.io'].updates.find(update => update.version === '${VERSION}').update_hash.replace('sha256:', '')")
          ACTUAL=$(sha256sum "$ASSET" | cut -d ' ' -f 1)
          test "$EXPECTED" = "$ACTUAL"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TAG="v${VERSION}"
          ASSET="build/zotero-card-view-${VERSION}.xpi"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Zotero Card View ${VERSION}" \
            --notes "首个公开测试版 / First public beta.\n\n提供 Zotero 9 文献卡片视图、Zotero Style 期刊指标与评级显示，以及按日期、题名、影响因子和评级排序。"
